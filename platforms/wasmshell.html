  const statusEl = document.getElementById('status');
  if(typeof WebAssembly.Suspending !== 'function') {
    statusEl.textContent = 'This browser does not support WebAssembly JavaScript Promise Integration (JSPI).';
  }
  var Module = {
    print: (...args) => console.log(...args),
    printErr: (...args) => console.error(...args),
    onRuntimeInitialized: () => { statusEl.style.display = 'none'; },
    onAbort: (what) => { statusEl.style.display = ''; statusEl.textContent = 'Error: ' + what; },
  };
</script>
